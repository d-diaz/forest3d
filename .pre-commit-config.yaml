repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.14.13
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
  # Run mypy in the Pixi dev environment so third-party types (e.g. JAX) are available.
  - repo: local
    hooks:
      - id: mypy-pixi-dev
        name: mypy (pixi dev)
        entry: pixi run -e dev mypy
        language: system
        types: [python]
