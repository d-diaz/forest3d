[workspace]
name = "forest3d"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[environments]
dev = ["dev"]
cuda = ["cuda"]  # linux-only in practice
dev-cuda = ["dev", "cuda"]

[dependencies]
python = ">=3.11,<3.14"
geopandas = "*"
ipywidgets = "*"
jupyter = "*"
k3d = "*"
matplotlib = "*"
numpy = "*"
pandas = "*"
pandera = "*"
pdal = "*"
pydantic = "*"
python-pdal = "*"
rasterio = "*"
seaborn = "*"

[pypi-dependencies]
jax = { extras = ["cpu"] }
laspy = { extras = ["lazrs"] }
numpyro = "*"

[feature.cuda]
platforms = ["linux-64"]

[feature.cuda.pypi-dependencies]
jax = { extras = ["cuda13"] }

[feature.cuda.pypi-options]
index-url = "https://pypi.org/simple"
find-links = [{ url = "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html" }]

[feature.dev.dependencies]
ipykernel = "*"
mypy = "*"
nbval = "*"
pre-commit = "*"
pytest = "*"
pytest-benchmark = "*"
ruff = "*"

[tasks]
ruff-check = "ruff check ."
ruff-format-check = "ruff format --check ."
lint = { depends-on = ["ruff-format-check", "ruff-check"] }
typecheck = "mypy"
test = "pytest"
notebooks = "pytest --nbval-lax --nbval-current-env notebooks"
bench = "pytest benchmarks --benchmark-only"
ci = { depends-on = ["lint", "typecheck", "test", "notebooks"] }
